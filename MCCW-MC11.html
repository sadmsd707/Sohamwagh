  console.log(`Loaded ${questions.length} circle questions`);

  let current = 0;
  const userAnswers = {};
  const seenQuestions = new Set();
  const startTime = new Date();
  let navPanelVisible = false;

  function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("quiz-content");
    container.innerHTML = `
      <div class="question-number">${q.number}</div>
      <div class="question">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          const id = `q${index}_${String.fromCharCode(65 + i)}`;
          const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
          return `
            <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
            <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
          `;
        }).join("")}
      </div>
    `;

    seenQuestions.add(index);
    document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
    document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
    updateNavPanel();
  }

  function updateNavPanel() {
    const questionList = document.getElementById("questionList");
    questionList.innerHTML = '';
    questions.forEach((q, idx) => {
      const div = document.createElement("div");
      div.className = "question-item";
      div.textContent = idx+1;
      if (userAnswers[idx]) div.classList.add("answered");
      else if (seenQuestions.has(idx)) div.classList.add("seen");
      else div.classList.add("not-seen");
      if (idx === current) div.classList.add("current");
      div.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
      questionList.appendChild(div);
    });
  }

  function toggleNavPanel() {
    navPanelVisible = !navPanelVisible;
    document.getElementById("navPanel").style.display = navPanelVisible ? "block" : "none";
  }

  function nextQuestion() { saveAnswer(); if (current < questions.length-1) { current++; renderQuestion(current); } }
  function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }
  function saveAnswer() {
    const sel = document.querySelector(`input[name="mcq${current}"]:checked`);
    if (sel) userAnswers[current] = sel.value;
  }

  function submitQuiz() {
    saveAnswer();
    const end = new Date();
    const mins = Math.floor((end-startTime)/60000);
    const secs = Math.floor(((end-startTime)%60000)/1000);
    let correct = 0;
    const details = [];
    questions.forEach((q,i) => {
      const u = userAnswers[i] || "—";
      const ok = u === q.correct;
      if(ok) correct++;
      details.push({number:q.number, userAns:u, correctAns:q.correct, isCorrect:ok});
    });
    localStorage.setItem("quizResults", JSON.stringify({
      total: questions.length,
      correct,
      accuracy: ((correct/questions.length)*100).toFixed(2),
      time: `${mins} min ${secs} sec`,
      details
    }));
    window.location.href = "results.html";
  }

  renderQuestion(current);

  let minutes=0, seconds=0;
  const timerEl = document.getElementById("timer");
  setInterval(() => {
    seconds++;
    if (seconds===60) { seconds=0; minutes++; }
    timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }, 1000);
</script>
