      padding: 5px 10px; border-radius: 4px; font-weight: 500;
    }

      padding: 5px 10px; border-radius: 4px; display: flex; align-items: center; gap: 5px;
    }

// ensure length 92
console.log(questions.length);

// quiz logic (exactly same as original page)
let current = 0;
const userAnswers = {};
const seenQuestions = new Set();
const startTime = new Date();
let navPanelVisible = false;

function renderQuestion(index) {
  const q = questions[index];
  const container = document.getElementById("quiz-content");
  container.innerHTML = `
    <div class="question-number">Question ${q.number} / 92</div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        const id = `q${index}_${letter}`;
        const checked = userAnswers[index] === letter ? "checked" : "";
        return `<input type="radio" id="${id}" name="mcq${index}" value="${letter}" ${checked}>
                <label for="${id}">${opt}</label>`;
      }).join("")}
    </div>
  `;
  seenQuestions.add(index);
  document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
  document.getElementById("nextBtn").style.display = index === questions.length-1 ? "none" : "inline-block";
  document.getElementById("submitBtn").style.display = index === questions.length-1 ? "inline-block" : "none";
  updateNavPanel();
}
function updateNavPanel() {
  const list = document.getElementById("questionList");
  list.innerHTML = '';
  questions.forEach((_, idx) => {
    const it = document.createElement("div");
    it.className = "question-item";
    if (userAnswers[idx]) it.classList.add("answered");
    else if (seenQuestions.has(idx)) it.classList.add("seen");
    else it.classList.add("not-seen");
    if (idx === current) it.classList.add("current");
    it.textContent = idx+1;
    it.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
    list.appendChild(it);
  });
}
function toggleNavPanel() {
  const p = document.getElementById("navPanel");
  navPanelVisible = !navPanelVisible;
  p.style.display = navPanelVisible ? "block" : "none";
}
function saveAnswer() {
  const sel = document.querySelector(`input[name="mcq${current}"]:checked`);
  if (sel) userAnswers[current] = sel.value;
}
function nextQuestion() { saveAnswer(); if (current < questions.length-1) { current++; renderQuestion(current); } }
function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }
function submitQuiz() {
  saveAnswer();
  const end = new Date();
  const diffMs = end - startTime;
  const min = Math.floor(diffMs/60000);
  const sec = Math.floor((diffMs%60000)/1000);
  let correct = 0;
  const results = questions.map((q,i) => {
    const u = userAnswers[i] || "Not answered";
    const ok = u === q.correct;
    if (ok) correct++;
    return { num: q.number, user: u, correct: q.correct, ok };
  });
  localStorage.setItem("quizResults", JSON.stringify({ total:92, correct, accuracy:((correct/92)*100).toFixed(2), time:min+" min "+sec+" sec", details:results }));
  window.location.href = "results.html";
}
renderQuestion(0);
let minutes=0, seconds=0;
const timerEl = document.getElementById("timer");
setInterval(()=>{ seconds++; if(seconds===60){ seconds=0; minutes++; } timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`; },1000);
</script>
