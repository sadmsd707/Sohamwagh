    { number: "Q180 (2016)", text: "p: square→rectangle, q: rhombus→kite. Truth of p→q and p↔q are", options: ["T,T", "T,F", "F,T", "F,F"], correct: "A" },
    // page 181
    { number: "Q181 (2011)", text: "Value of (1+Δ)(1−∇) is", options: ["1−Δ∇", "1+Δ−∇", "1", "0"], correct: "C" },
    // page 182
    { number: "Q182 (2011)", text: "Boolean polynomial for circuit is", options: ["(∼p∧q)∨(p∧∼q)", "(∼p∨q)∨(p∨∼q)", "(∼p∧∼q)∧(q∧p)", "(∼p∧q)∧(p∧q)"], correct: "A" },
    // page 183
    { number: "Q183 (2011)", text: "In Boolean algebra, x ∧ (x ∨ y) =", options: ["x", "y", "x∧y", "x∨y"], correct: "A" },
    // page 184
    { number: "Q184 (2011)", text: "Inverse of (p ∧ ∼q) ⇒ r is", options: ["(∼p ∨ q) ⇒ ∼r", "(∼p ∧ q) ⇒ ∼r", "(∼p ∨ q) ⇒ r", "(p ∧ ∼q) ⇒ ∼r"], correct: "A" },
    // page 185
    { number: "Q185 (2011)", text: "(p⇒∼p)∧(∼p⇒p) is", options: ["tautology", "contradiction", "both", "neither"], correct: "B" },
    // page 186
    { number: "Q186 (2010)", text: "(p∧q) ∨ ∼p is equivalent to", options: ["p∨q", "∼p∨q", "∼p∧q", "p∧q"], correct: "B" },
    // page 187
    { number: "Q187 (2010)", text: "p=T,q=F,r=F. Truth of (p∧∼q)→(∼p∨r) is", options: ["T", "F", "T or F", "Cannot determine"], correct: "A" },
    // page 188
    { number: "Q188 (2010)", text: "Output of circuit is", options: ["p∧q", "p∨q", "p∧∼q", "∼p∧q"], correct: "B" },
    // page 189
    { number: "Q189 (2009)", text: "Simplify (p∨q) ∧ (p∨∼q)", options: ["q", "T", "p", "F"], correct: "C" },
    // page 190
    { number: "Q190 (2009)", text: "Simplify circuit → boolean polynomial", options: ["p∨(q∧r)", "p∧(q∧r)", "p∨(q∨r)", "p∧(q∨r)"], correct: "A" },
    // page 191
    { number: "Q191 (2009)", text: "∼(p→q) ≡", options: ["∼p∧∼q", "∼p∧q", "p∧∼q", "∼p∨∼q"], correct: "C" },
    // page 192
    { number: "Q192 (2008)", text: "Negation of 'If it rains I go to school' is", options: ["It does not rain and I go", "None", "It rains and I go", "It rains and I do not go"], correct: "D" },
    // page 193
    { number: "Q193 (2008)", text: "Dual of (x′∨y′) = x∧y is", options: ["(x′∨y′) = x∨y", "(x′∧y′)′ = x∨y", "(x′∧y′)′ = x∧y", "None"], correct: "B" },
    // page 194
    { number: "Q194 (2008)", text: "Boolean polynomial for circuit", options: ["(∼p∧q)∧(p∧q)", "(∼p∧q)∨(p∧∼q)", "(∼p∨q)∨(p∨∼q)", "(∼p∧∼q)∧(q∧p)"], correct: "B" },
    // page 195
    { number: "Q195 (2007)", text: "Dual of [p ∨ (∼q)] ∧ (∼p) is", options: ["p ∨ (∼q) ∨ ∼p", "None", "p ∧ ∼(q ∨ ∼p)", "(p∧∼q) ∨ ∼p"], correct: "D" },
    // page 196
    { number: "Q196 (2007)", text: "Value of Δ∇ is", options: ["0", "1", "Δ", "∇"], correct: "A" },
    // page 197
    { number: "Q197 (2007)", text: "Which has truth value F?", options: ["Cube roots unity in GP", "None", "Quadratic always real root", "P(n,2) ways"], correct: "C" }
  ];

  // ensure 197 questions (some pages merged, but total length is 197)
  console.log("loaded", questions.length);

  // ---------- QUIZ LOGIC ----------
  let current = 0;
  const userAnswers = {};
  const seenQuestions = new Set();
  const startTime = new Date();
  let navPanelVisible = false;

  function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("quiz-content");
    container.innerHTML = `
      <div class="question-number">${q.number}</div>
      <div class="question">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          const id = `q${index}_${String.fromCharCode(65 + i)}`;
          const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
          return `
            <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
            <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
          `;
        }).join("")}
      </div>
    `;

    seenQuestions.add(index);
    document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
    document.getElementById("nextBtn").style.display = index === questions.length-1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = index === questions.length-1 ? "inline-block" : "none";
    updateNavPanel();
  }

  function updateNavPanel() {
    const qList = document.getElementById("questionList");
    qList.innerHTML = '';
    questions.forEach((_, idx) => {
      const item = document.createElement("div");
      item.className = "question-item";
      if (userAnswers[idx]) item.classList.add("answered");
      else if (seenQuestions.has(idx)) item.classList.add("seen");
      else item.classList.add("not-seen");
      if (idx === current) item.classList.add("current");
      item.textContent = idx+1;
      item.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
      qList.appendChild(item);
    });
  }

  function toggleNavPanel() {
    navPanelVisible = !navPanelVisible;
    document.getElementById("navPanel").style.display = navPanelVisible ? "block" : "none";
  }

  function nextQuestion() { saveAnswer(); if (current < questions.length-1) { current++; renderQuestion(current); } }
  function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }
  function saveAnswer() {
    const sel = document.querySelector(`input[name="mcq${current}"]:checked`);
    if (sel) userAnswers[current] = sel.value;
  }

  function submitQuiz() {
    saveAnswer();
    const end = new Date();
    const mins = Math.floor((end-startTime)/60000);
    const secs = Math.floor(((end-startTime)%60000)/1000);
    let correct = 0;
    const details = [];
    questions.forEach((q, i) => {
      const u = userAnswers[i] || "NA";
      const isCor = u === q.correct;
      if (isCor) correct++;
      details.push({num: q.number, u, c: q.correct, ok: isCor});
    });
    localStorage.setItem("quizResults", JSON.stringify({
      total: questions.length, correct,
      accuracy: ((correct/questions.length)*100).toFixed(2),
      time: `${mins} min ${secs} sec`,
      details
    }));
    window.location.href = "results.html";
  }

  renderQuestion(current);
  let minutes=0, seconds=0;
  setInterval(() => {
    seconds++;
    if(seconds===60){ seconds=0; minutes++; }
    document.getElementById("timer").textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }, 1000);
</script>
