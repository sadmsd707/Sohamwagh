  <script>
    const questions = [
      // Questions 1-50
      {number:"Question 01", text:"Calculate the work done in the oxidation of one mole HCl(g) at 27°C, according to reaction: 4HCl(g) + O₂(g) → 2Cl₂(g) + 2H₂O(g) (R = 8.314 J K⁻¹ mol⁻¹) (MHT CET 2025 - 5 May Shift 2)", options:["-1247 J","-2494 J","-4988 J","-7472 J"], correct:"B"},
      {number:"Question 02", text:"Which from following is an example of an intensive property of the system? (MHT CET 2025 - 5 May Shift 2)", options:["Mass","Volume","Temperature","Internal energy"], correct:"C"},
      {number:"Question 03", text:"For a certain reaction ΔH = -225 kJ and ΔS = -150 JK⁻¹. Find the temperature so that ΔG is zero. (MHT CET 2025 - 5 May Shift 2)", options:["1500 K","1200 K","1000 K","800 K"], correct:"A"},
      {number:"Question 04", text:"Which of the following processes occurs in the reaction given below: C(graphite) → C(g)? (MHT CET 2025 - 27 Apr Shift 2)", options:["Sublimation","Atomization","Vaporization","Fusion"], correct:"B"},
      {number:"Question 05", text:"Calculate the work done in kJ when 3 moles of an ideal gas at 27°C expand isothermally and reversibly from 10 atm to 1 atm [R = 8.314 J K⁻¹ mol⁻¹] (MHT CET 2025 - 27 Apr Shift 2)", options:["-17.23 kJ","-34.46 kJ","-51.69 kJ","-68.92 kJ"], correct:"A"},
      {number:"Question 06", text:"In a reversible expansion, one mole of gas is expanded isothermally at 200 K till its volume increases 10 times. Calculate ΔS_total at equilibrium? (MHT CET 2025 - 27 Apr Shift 2)", options:["0","R ln 10","2R ln 10","R ln 100"], correct:"A"},
      {number:"Question 07", text:"Calculate the work done if 1 mole of certain gas compressed isothermally and reversibly at 300 K from initial pressure x bar to final pressure 2x bar [R = 8.314 J K⁻¹ mol⁻¹] (MHT CET 2025 - 26 Apr Shift 2)", options:["-1729 J","-1738 J","-1747 J","-1756 J"], correct:"C"},
      {number:"Question 08", text:"Identify from following the correct set of thermodynamic conditions for the reaction to be spontaneous at all temperature. (MHT CET 2025 - 26 Apr Shift 2)", options:["ΔH < 0, ΔS > 0","ΔH > 0, ΔS < 0","ΔH < 0, ΔS < 0","ΔH > 0, ΔS > 0"], correct:"A"},
      {number:"Question 09", text:"Calculate the change in internal energy of the system if work done by the system is 18 joule and absorbs heat 50 joule in a particular reaction. (MHT CET 2025 - 26 Apr Shift 1)", options:["32 J","68 J","-32 J","-68 J"], correct:"A"},
      {number:"Question 10", text:"Identify from following the correct set of thermodynamic conditions for the reaction to be nonspontaneous at all temperature. (MHT CET 2025 - 26 Apr Shift 1)", options:["ΔH > 0, ΔS < 0","ΔH < 0, ΔS > 0","ΔH > 0, ΔS > 0","ΔH < 0, ΔS < 0"], correct:"A"},
      {number:"Question 11", text:"Calculate ΔS_total for a certain reaction if ΔH = -150 kJ and ΔS = 32 JK⁻¹ at 300 K. (MHT CET 2025 - 26 Apr Shift 1)", options:["468 JK⁻¹","532 JK⁻¹","798 JK⁻¹","266 JK⁻¹"], correct:"B"},
      {number:"Question 12", text:"Calculate the work done in joule if 1 mole of an ideal gas compressed from volume 24 dm³ to 13 dm³ at constant external pressure 3 bar. (MHT CET 2025 - 25 Apr Shift 2)", options:["-3300 J","-330 J","-33 J","-3.3 J"], correct:"A"},
      {number:"Question 13", text:"Which from following is an example of both intensive property and state function? (MHT CET 2025 - 25 Apr Shift 2)", options:["Temperature","Heat","Work","Internal energy"], correct:"A"},
      {number:"Question 14", text:"For a certain reaction, ΔH = -210 kJ and ΔS = -150 J K⁻¹. Find the temperature so that ΔG = 0. (MHT CET 2025 - 25 Apr Shift 2)", options:["1400 K","1200 K","1000 K","800 K"], correct:"A"},
      {number:"Question 15", text:"Calculate ΔH° for a reaction if ΔS° = 120 JK⁻¹ and ΔG° = 28000 J. (MHT CET 2025 - 25 Apr Shift 1)", options:["64000 J","-64000 J","32000 J","-32000 J"], correct:"A"},
      {number:"Question 16", text:"Calculate the work done in joule if 1 mole of ideal gas is compressed from 25 dm³ to 13 dm³ at constant external pressure 4 bar. (MHT CET 2025 - 25 Apr Shift 1)", options:["-4800 J","-480 J","-48 J","-4.8 J"], correct:"A"},
      {number:"Question 17", text:"Which from following transformations is endothermic in nature? (MHT CET 2025 - 25 Apr Shift 1)", options:["Freezing","Condensation","Sublimation","Deposition"], correct:"C"},
      {number:"Question 18", text:"Identify from following the correct set of thermodynamic conditions for the reaction to be spontaneous below equilibrium temperature. (MHT CET 2025 - 23 Apr Shift 2)", options:["ΔH > 0, ΔS > 0","ΔH < 0, ΔS > 0","ΔH < 0, ΔS < 0","ΔH > 0, ΔS < 0"], correct:"C"},
      {number:"Question 19", text:"Calculate work done if 1 mole of an ideal gas expands isothermally from 2 dm³ to 2.8 dm³ against constant external pressure 1 atm. (MHT CET 2025 - 23 Apr Shift 2)", options:["-81.1 J","-8.11 J","-0.811 J","-0.0811 J"], correct:"A"},
      {number:"Question 20", text:"Which from following reactions is exothermic? (MHT CET 2025 - 23 Apr Shift 1)", options:["Dissolution of NH₄Cl in water","Dissolution of NaCl in water","Combustion of methane","Evaporation of water"], correct:"C"},
      {number:"Question 21", text:"Calculate work done in isothermal reversible expansion of 1 mole ideal gas from initial pressure 10 bar to final pressure 1 bar at 300 K (R = 8.314 J K⁻¹ mol⁻¹). (MHT CET 2025 - 23 Apr Shift 1)", options:["-5744 J","-574.4 J","-57.44 J","-5.744 J"], correct:"A"},
      {number:"Question 22", text:"Calculate the standard enthalpy change for reaction: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l). If ΔfH°(CH₄) = -75 kJ mol⁻¹, ΔfH°(CO₂) = -394 kJ mol⁻¹, ΔfH°(H₂O) = -286 kJ mol⁻¹. (MHT CET 2025 - 22 Apr Shift 2)", options:["-891 kJ","-802 kJ","-721 kJ","-640 kJ"], correct:"A"},
      {number:"Question 23", text:"Identify from following reactions that exhibits negative work done. (MHT CET 2025 - 22 Apr Shift 2)", options:["Expansion of gas","Compression of gas","Free expansion","Isothermal expansion"], correct:"B"},
      {number:"Question 24", text:"Calculate the enthalpy of solution of potassium chloride if its ΔLH = 700 kJ mol⁻¹ and ΔhydH = -680 kJ mol⁻¹. (MHT CET 2025 - 22 Apr Shift 2)", options:["20 kJ mol⁻¹","-20 kJ mol⁻¹","1380 kJ mol⁻¹","-1380 kJ mol⁻¹"], correct:"A"},
      {number:"Question 25", text:"Calculate the change in internal energy of the system if 20 kJ work is done on the system and it releases 10 kJ heat in a particular reaction. (MHT CET 2025 - 22 Apr Shift 2)", options:["10 kJ","30 kJ","-10 kJ","-30 kJ"], correct:"A"},
      {number:"Question 26", text:"Calculate the work done in joule if 2 moles of an ideal gas expand isothermally from 15.5 dm³ to 20 dm³ at constant pressure 1 atm. (MHT CET 2025 - 22 Apr Shift 1)", options:["-456 J","-45.6 J","-4.56 J","-0.456 J"], correct:"A"},
      {number:"Question 27", text:"1.8 g water is vapourised by supplying 4 kJ heat at 100°C. What is the heat of vapourisation of water at same temperature? (MHT CET 2025 - 22 Apr Shift 1)", options:["40 kJ mol⁻¹","44 kJ mol⁻¹","48 kJ mol⁻¹","52 kJ mol⁻¹"], correct:"B"},
      {number:"Question 28", text:"Calculate standard enthalpy change of reaction: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l). (MHT CET 2025 - 22 Apr Shift 1)", options:["-891 kJ","-802 kJ","-721 kJ","-640 kJ"], correct:"A"},
      {number:"Question 29", text:"Calculate standard enthalpy change of reaction: C₂H₂(g) + 5/2 O₂(g) → 2CO₂(g) + H₂O(l) if ΔfH°(CO₂) = -393 kJ mol⁻¹, ΔfH°(H₂O) = -286 kJ mol⁻¹, ΔfH°(C₂H₂) = 227 kJ mol⁻¹. (MHT CET 2025 - 21 Apr Shift 2)", options:["-1299 kJ","-1411 kJ","-1523 kJ","-1635 kJ"], correct:"A"},
      {number:"Question 30", text:"Calculate the change in internal energy of the system if 25 kJ of work done by the system and it absorbs 10 kJ of heat. (MHT CET 2025 - 21 Apr Shift 2)", options:["-15 kJ","15 kJ","35 kJ","-35 kJ"], correct:"A"},
      {number:"Question 31", text:"Identify from following an example of intensive property? (MHT CET 2025 - 21 Apr Shift 2)", options:["Mass","Volume","Density","Internal energy"], correct:"C"},
      {number:"Question 32", text:"Calculate the work done in following reaction at 27°C: 4SO₂(g) + 2O₂(g) → 4SO₃(g), (R = 8.314 J K⁻¹ mol⁻¹). (MHT CET 2025 - 21 Apr Shift 1)", options:["-4.988 kJ","-2.494 kJ","-1.247 kJ","-0.623 kJ"], correct:"A"},
      {number:"Question 33", text:"Which of the following set of thermodynamic conditions is true for the reaction to be spontaneous at high temperature? (MHT CET 2025 - 21 Apr Shift 1)", options:["ΔH > 0, ΔS > 0","ΔH < 0, ΔS > 0","ΔH < 0, ΔS < 0","ΔH > 0, ΔS < 0"], correct:"A"},
      {number:"Question 34", text:"Find standard enthalpy of formation of ammonia from following reaction: N₂(g) + 3H₂(g) → 2NH₃(g); ΔrH° = -92.0 kJ. (MHT CET 2025 - 21 Apr Shift 1)", options:["-46.0 kJ mol⁻¹","-92.0 kJ mol⁻¹","-184.0 kJ mol⁻¹","-276.0 kJ mol⁻¹"], correct:"A"},
      {number:"Question 35", text:"Calculate work done if 1 mole of an ideal gas compressed isothermally and reversibly from 12 dm³ to 6 dm³ at 300 K. [R = 8.314 J K⁻¹ mol⁻¹]. (MHT CET 2025 - 20 Apr Shift 2)", options:["-1729 J","-1738 J","-1747 J","-1756 J"], correct:"A"},
      {number:"Question 36", text:"Identify from following physical transformations that exhibits decrease in entropy. (MHT CET 2025 - 20 Apr Shift 2)", options:["Melting of ice","Vaporization of water","Condensation of steam","Sublimation of dry ice"], correct:"C"},
      {number:"Question 37", text:"Calculate the standard enthalpy change of following reaction: C₂H₄(g) + 3O₂(g) → 2CO₂(g) + 2H₂O(l). If ΔfH°(C₂H₄) = -52 kJ mol⁻¹, ΔfH°(CO₂) = -390 kJ mol⁻¹, ΔfH°(H₂O) = -286 kJ mol⁻¹. (MHT CET 2025 - 20 Apr Shift 2)", options:["-1412 kJ","-1320 kJ","-1228 kJ","-1136 kJ"], correct:"A"},
      {number:"Question 38", text:"Which from following process involves zero work done? (MHT CET 2025 - 20 Apr Shift 1)", options:["Adiabatic compression of gas","Free expansion of gas","Isobaric expansion of gas","Isothermal expansion of gas"], correct:"B"},
      {number:"Question 39", text:"Calculate the constant external pressure required to expand 2 moles of an ideal gas from volume 15 dm³ to 20 dm³ if amount of work done is -600 J. (MHT CET 2025 - 20 Apr Shift 1)", options:["1.2 × 10⁵ Pa","1.5 × 10⁵ Pa","1.8 × 10⁵ Pa","2.0 × 10⁵ Pa"], correct:"A"},
      {number:"Question 40", text:"Calculate the enthalpy of vaporisation of ethanol if 11.5 g of ethanol is completely vaporised by supplying 11.8 kJ of heat. (MHT CET 2025 - 20 Apr Shift 1)", options:["38.6 kJ mol⁻¹","42.3 kJ mol⁻¹","46.0 kJ mol⁻¹","49.7 kJ mol⁻¹"], correct:"C"},
      {number:"Question 41", text:"Calculate the enthalpy change of vaporisation of benzene if 13 gram of benzene vaporised by supplying 5.1 kJ of heat. (MHT CET 2025 - 19 Apr Shift 2)", options:["30.1 kJ mol⁻¹","33.6 kJ mol⁻¹","37.1 kJ mol⁻¹","40.6 kJ mol⁻¹"], correct:"B"},
      {number:"Question 42", text:"Calculate the entropy change of surrounding if 2 moles of H₂ and 1 mole of O₂ gas combine to form 2 moles of liquid water by releasing 525 kJ heat to surrounding at constant pressure and at 300 K. (MHT CET 2025 - 19 Apr Shift 2)", options:["1750 J K⁻¹","-1750 J K⁻¹","875 J K⁻¹","-875 J K⁻¹"], correct:"A"},
      {number:"Question 43", text:"Which of the following reactions exhibits decrease in entropy? (MHT CET 2025 - 19 Apr Shift 2)", options:["Dissolution of salt in water","Evaporation of water","Combustion of methane","Formation of ammonia from N₂ and H₂"], correct:"D"},
      {number:"Question 44", text:"Calculate ΔS_total for a certain reaction at 298 K if ΔH° = -208.6 kJ and ΔS° = -36 J K⁻¹. (MHT CET 2025 - 19 Apr Shift 1)", options:["664 J K⁻¹","736 J K⁻¹","834 J K⁻¹","926 J K⁻¹"], correct:"A"},
      {number:"Question 45", text:"Calculate the change in internal energy of the system if 20 kJ of work is done on the system and it releases 10 kJ of heat in a particular reaction. (MHT CET 2025 - 19 Apr Shift 1)", options:["10 kJ","30 kJ","-10 kJ","-30 kJ"], correct:"A"},
      {number:"Question 46", text:"Which from following reactions performs zero work? (MHT CET 2025 - 19 Apr Shift 1)", options:["H₂(g) + Cl₂(g) → 2HCl(g)","N₂(g) + 3H₂(g) → 2NH₃(g)","2H₂(g) + O₂(g) → 2H₂O(l)","All of these"], correct:"C"},
      {number:"Question 47", text:"Calculate standard internal energy change for OF₂(g) + H₂O(g) → 2HF(g) + O₂(g) at 300 K, if ΔfH° of OF₂(g), H₂O(g) and HF(g) are 20, -250 and -270 kJ mol⁻¹ respectively. [R = 8.314 J K⁻¹ mol⁻¹]. (MHT CET 2024 - 16 May Shift 2)", options:["-760 kJ","-770 kJ","-780 kJ","-790 kJ"], correct:"C"},
      {number:"Question 48", text:"Calculate internal energy change of a system if work done by the system is 8 J and heat supplied to it is 40 J. (MHT CET 2024 - 16 May Shift 2)", options:["32 J","48 J","-32 J","-48 J"], correct:"A"},
      {number:"Question 49", text:"Which of the following equation, relates temperature of a reaction with ΔH° and ΔS° at equilibrium? (MHT CET 2024 - 16 May Shift 2)", options:["T = ΔH°/ΔS°","T = ΔS°/ΔH°","T = ΔG°/ΔH°","T = ΔH°/ΔG°"], correct:"A"},
      {number:"Question 50", text:"The enthalpy of vaporisation of a liquid is 30 kJ mol⁻¹ and entropy of vaporisation is 75 J K⁻¹ mol⁻¹. Calculate boiling point of liquid at 1 atm. (MHT CET 2024 - 16 May Shift 1)", options:["400 K","300 K","200 K","100 K"], correct:"A"},

      // Questions 51-100
      {number:"Question 51", text:"Find work done on 2 mole of an ideal gas at 27°C if it is compressed reversibly and isothermally from 5.05 × 10⁶ Nm⁻² to 1.01 × 10⁵ Nm⁻² pressure. (MHT CET 2024 - 16 May Shift 1)", options:["-34.7 kJ","-28.9 kJ","-22.4 kJ","-18.6 kJ"], correct:"A"},
      {number:"Question 52", text:"A system performs mechanical work equal to 15 kJ and loses 2 kJ of heat to surrounding. What is the change in internal energy of a system? (MHT CET 2024 - 15 May Shift 2)", options:["-17 kJ","-13 kJ","13 kJ","17 kJ"], correct:"A"},
      {number:"Question 53", text:"Find the constant external pressure required to expand a gas from 2.5 L to 4.5 L if amount of work done is 500 J at 298 K? (MHT CET 2024 - 15 May Shift 2)", options:["2.5 × 10⁵ Pa","2.5 × 10⁴ Pa","5.0 × 10⁵ Pa","5.0 × 10⁴ Pa"], correct:"A"},
      {number:"Question 54", text:"In a particular reaction 'x' kJ of heat is released by the system and 'y' kJ of work done is done on the system. What is internal energy change? (MHT CET 2024 - 15 May Shift 2)", options:["-(x+y) kJ","(x-y) kJ","(y-x) kJ","(x+y) kJ"], correct:"C"},
      {number:"Question 55", text:"Calculate the value of ΔG for the following reaction: N₂O₄(g) → 2NO₂(g) if ΔH = 57.44 kJ and ΔS = 176 J K⁻¹ mol⁻¹. (MHT CET 2024 - 15 May Shift 1)", options:["4.96 kJ","5.76 kJ","6.56 kJ","7.36 kJ"], correct:"A"},
      {number:"Question 56", text:"Under similar conditions enthalpy of freezing is exactly opposite to: (MHT CET 2024 - 15 May Shift 1)", options:["Enthalpy of solution","Enthalpy of vaporization","Enthalpy of atomization","Enthalpy of fusion"], correct:"D"},
      {number:"Question 57", text:"100 ml of H₂(g) and 100 ml of Cl₂(g) were allowed to react at 1 bar pressure as H₂(g) + Cl₂(g) → 2HCl(g). What will be the PV type of work done during reaction? (MHT CET 2024 - 15 May Shift 1)", options:["Zero","Positive","Negative","Cannot determine"], correct:"A"},
      {number:"Question 58", text:"Identify the process from following such that volume of system remains constant. (MHT CET 2024 - 11 May Shift 2)", options:["Isobaric","Isothermal","Isochoric","Adiabatic"], correct:"C"},
      {number:"Question 59", text:"Calculate the enthalpy change when 12 g carbon react with sufficient hydrogen to form methane. If enthalpy of formation of methane is -75 kJ mol⁻¹. (MHT CET 2024 - 11 May Shift 2)", options:["-75 kJ","-150 kJ","-225 kJ","-300 kJ"], correct:"A"},
      {number:"Question 60", text:"Which among the following pair of properties are intensive? (MHT CET 2024 - 11 May Shift 1)", options:["Mass and temperature","Heat capacity and specific heat","Internal energy and boiling point","Surface tension and viscosity"], correct:"D"},
      {number:"Question 61", text:"2 moles of an ideal gas expands isothermally from 5 dm³ to 10 dm³ at a constant external pressure of 1.5 bar. Calculate work done. (MHT CET 2024 - 11 May Shift 1)", options:["-750 J","-7.5 J","-75 J","-0.75 J"], correct:"A"},
      {number:"Question 62", text:"An ideal gas expands against constant external pressure of 2 bar from 5 L to 8 L and absorbs 10 kJ of heat. What is ΔU of the system? (MHT CET 2024 - 11 May Shift 1)", options:["9.4 kJ","10.6 kJ","11.8 kJ","13.0 kJ"], correct:"A"},
      {number:"Question 63", text:"For an ideal gas, the heat of reaction at constant pressure and heat of reaction at constant volume are related by equation: (MHT CET 2024 - 10 May Shift 2)", options:["Qp = Qv + ΔnRT","Qv = Qp + ΔnRT","Qp = Qv - ΔnRT","Qv = Qp - ΔnRT"], correct:"A"},
      {number:"Question 64", text:"For the reaction CH₄(g) + H₂(g) → C₂H₆(g), Kp = 3.356 × 10¹⁷, calculate ΔG° for the reaction at 298 K. (MHT CET 2024 - 10 May Shift 2)", options:["-100 kJ","-150 kJ","-200 kJ","-250 kJ"], correct:"A"},
      {number:"Question 65", text:"A gas expands isothermally against a constant external pressure of 1 bar from 10 dm³ to 20 dm³ by absorbing 800 J of heat from surrounding. Calculate value of ΔU. (MHT CET 2024 - 10 May Shift 2)", options:["300 J","-300 J","500 J","-500 J"], correct:"B"},
      {number:"Question 66", text:"Which of the following equations indicates increase in entropy? (MHT CET 2024 - 10 May Shift 1)", options:["CO₂(g) → CO₂(s)","H₂O(l) → H₂O(s)","NH₃(g) → NH₃(l)","I₂(s) → I₂(g)"], correct:"D"},
      {number:"Question 67", text:"Which from following statements is true about internal energy? (MHT CET 2024 - 10 May Shift 1)", options:["It increases with increase in temperature","It decreases with increase in temperature","It is not a state function","Remain constant on changing temperature"], correct:"A"},

    let current = 0;
    const userAnswers = {};
    const seenQuestions = new Set();
    const startTime = new Date();
    let navPanelVisible = false;

    function renderQuestion(index) {
      const q = questions[index];
      const container = document.getElementById("quiz-content");
      container.innerHTML = `
        <div class="question-number">${q.number}</div>
        <div class="question">${q.text}</div>
        <div class="options">
          ${q.options.map((opt, i) => {
            const id = `q${index}_${String.fromCharCode(65 + i)}`;
            const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
            return `
              <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
              <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
            `;
          }).join("")}
        </div>
      `;

      seenQuestions.add(index);
      
      document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
      document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
      document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
      
      updateNavPanel();
    }

    function updateNavPanel() {
      const questionList = document.getElementById("questionList");
      questionList.innerHTML = '';
      
      questions.forEach((q, index) => {
        const questionItem = document.createElement("div");
        questionItem.className = "question-item";
        questionItem.textContent = index + 1;
        
        if (userAnswers[index]) {
          questionItem.classList.add("answered");
        } else if (seenQuestions.has(index)) {
          questionItem.classList.add("seen");
        } else {
          questionItem.classList.add("not-seen");
        }
        
        if (index === current) {
          questionItem.classList.add("current");
        }
        
        questionItem.onclick = () => {
          saveAnswer();
          current = index;
          renderQuestion(current);
          toggleNavPanel();
        };
        
        questionList.appendChild(questionItem);
      });
    }

    function toggleNavPanel() {
      const navPanel = document.getElementById("navPanel");
      navPanelVisible = !navPanelVisible;
      navPanel.style.display = navPanelVisible ? "block" : "none";
    }

    function nextQuestion() {
      saveAnswer();
      if (current < questions.length - 1) {
        current++;
        renderQuestion(current);
      }
    }

    function prevQuestion() {
      saveAnswer();
      if (current > 0) {
        current--;
        renderQuestion(current);
      }
    }

    function saveAnswer() {
      const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
      if (selected) {
        userAnswers[current] = selected.value;
      }
    }

    function submitQuiz() {
      saveAnswer();
      const endTime = new Date();
      const timeTakenMs = endTime - startTime;
      const timeTakenMin = Math.floor(timeTakenMs / 60000);
      const timeTakenSec = Math.floor((timeTakenMs % 60000) / 1000);

      let correct = 0;
      const results = [];

      questions.forEach((q, i) => {
        const userAns = userAnswers[i] || "Not Answered";
        const isCorrect = userAns === q.correct;
        if (isCorrect) correct++;
        results.push({
          number: q.number,
          userAns,
          correctAns: q.correct,
          isCorrect
        });
      });

      localStorage.setItem("quizResults", JSON.stringify({
        total: questions.length,
        correct,
        accuracy: (correct / questions.length * 100).toFixed(2),
        time: `${timeTakenMin} min ${timeTakenSec} sec`,
        details: results
      }));

      window.location.href = "results.html";
    }

    // Initialize the quiz
    renderQuestion(current);

    // Stopwatch Timer
    let minutes = 0, seconds = 0;
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      seconds++;
      if (seconds === 60) {
        seconds = 0;
        minutes++;
      }
      timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }, 1000);
  </script>
