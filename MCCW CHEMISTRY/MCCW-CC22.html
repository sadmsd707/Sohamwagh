      {text: "Which among the following group 15 elements does not exhibit allotropy?", options: ["Nitrogen", "Phosphorus", "Arsenic", "Antimony"], correct: "A"},
      {text: "For the conversion of oxygen to ozone in the atmosphere, nitric oxide in gaseous phase acts as", options: ["homogeneous catalyst", "Inhibitor", "enzyme catalyst", "heterogeneous catalyst"], correct: "A"},
      {text: "Which of following elements does not react with hot concentrated sulphuric acid?", options: ["Copper", "Zinc", "Magnesium", "Gold"], correct: "D"},
      {text: "Question 122 (Placeholder)", options: ["Option A", "Option B", "Option C", "Option D"], correct: "B"},
      {text: "Which among the following does not form polyhalide ion?", options: ["Fluorine", "Chlorine", "Bromine", "Iodine"], correct: "A"},
      {text: "In ozone molecule the formal charge on the central oxygen atom is", options: ["0", "+1", "-1", "+2"], correct: "A"},
      {text: "The oxidation number of sulphur in S₈ molecule is", options: ["0", "+2", "+4", "+6"], correct: "A"},
      {text: "Which of the following is also called as nitrogen sesquioxide?", options: ["NO", "N₂O", "N₂O₃", "N₂O₅"], correct: "C"},
      {text: "In which among the following compounds, oxidation number of nitrogen is +5?", options: ["NH₃", "N₂O", "NO₂", "HNO₃"], correct: "D"},
      {text: "Oxidation state of nitrogen in nitric oxide is", options: ["+1", "+2", "+3", "+4"], correct: "B"},
      {text: "Which mixture is used for respiration by deep sea divers?", options: ["O₂ and He", "O₂ and N₂", "O₂ and Ar", "O₂ and Ne"], correct: "A"},
      {text: "Which among the group - 15 elements does NOT exist as tetra atomic molecule?", options: ["Nitrogen", "Phosphorus", "Arsenic", "Antimony"], correct: "A"},
      {text: "The element that does NOT exhibits allotropy is", options: ["Phosphorus", "Antimony", "Bismuth", "Arsenic"], correct: "C"},
      {text: "In which substance does nitrogen exhibit the lowest oxidation state?", options: ["NH₃", "N₂O", "NO", "NO₂"], correct: "A"},
      {text: "Which among the following oxoacids of phosphorus shows a tendency of disproportionation?", options: ["H₃PO₂", "H₃PO₃", "H₃PO₄", "H₄P₂O₇"], correct: "A"},
      {text: "A certain reaction occurs in two steps. In the reaction, what is the role of NO(g)?", options: ["intermediate", "catalyst", "product", "reactant"], correct: "A"},
      {text: "Which element among the following does NOT form diatomic molecules?", options: ["Hydrogen", "Oxygen", "Nitrogen", "Phosphorus"], correct: "D"},
      {text: "Identify the compound in which phosphorus exists in the oxidation state of +1.", options: ["Phosphinic acid (H₃PO₂)", "Phosphonic acid (H₃PO₃)", "Orthophosphoric acid (H₃PO₄)", "Pyrophosphorus acid (H₄P₂O₅)"], correct: "A"},
      {text: "The most abundant noble gas in the atmosphere is", options: ["Helium", "Neon", "Argon", "Xenon"], correct: "C"},
      {text: "What is the highest oxidation state exhibited by Group-17 elements?", options: ["+1", "+3", "+5", "+7"], correct: "D"},
      {text: "Which is the most stable allotrope of sulphur?", options: ["Colloidal Sulphur", "Plastic Sulphur", "Monoclinic Sulphur", "Octahedral Sulphur"], correct: "C"},
      {text: "Haber process is used for the production of which of the following?", options: ["Nitric acid", "Sulphuric acid", "Ammonia", "Hydrochloric acid"], correct: "C"},
      {text: "The solution of BiCl₃ in dil. HCl when diluted with water, white precipitate is formed which is", options: ["BiOCl", "Bi(OH)₃", "Bi₂O₃", "Bi"], correct: "A"},
      {text: "Which of the following compound of xenon does not exists?", options: ["XeF₂", "XeF₄", "XeF₆", "XeF₈"], correct: "D"},
      {text: "The laughing gas is", options: ["NO", "N₂O", "NO₂", "N₂O₄"], correct: "B"},
      {text: "Which of the following property does not correspond to the order HI < HBr < HCl < HF?", options: ["Bond length", "Thermal stability", "Acidic strength", "Boiling point"], correct: "D"},
      {text: "The comparatively high b.pt. of HF is due to", options: ["small size of hydrogen atom", "high IE of fluorine", "high reactivity of fluorine", "formation of hydrogen bonds and consequent association"], correct: "D"},
      {text: "Which one of the following can be purified by sublimation?", options: ["Iodine", "Sodium chloride", "Potassium nitrate", "Sulphur"], correct: "A"},
      {text: "Which one of the following reacts with glass?", options: ["HF", "HCl", "HBr", "HI"], correct: "A"}
    ];

    // Create questions array
    for (let i = 0; i < 147; i++) {
      if (i < questionData.length) {
        questions.push({
          number: `Question ${i + 1}/147`,
          text: questionData[i].text,
          options: questionData[i].options,
          correct: questionData[i].correct
        });
      } else {
        // Fallback for any missing questions
        questions.push({
          number: `Question ${i + 1}/147`,
          text: `MHT CET Question ${i + 1} - Select the correct option`,
          options: ["Option A", "Option B", "Option C", "Option D"],
          correct: "B"
        });
      }
    }

    let current = 0;
    const userAnswers = {};
    const seenQuestions = new Set();
    const startTime = new Date();
    let navPanelVisible = false;

    function renderQuestion(index) {
      const q = questions[index];
      const container = document.getElementById("quiz-content");
      container.innerHTML = `
        <div class="exam-info">MHT CET ${getYearForQuestion(index + 1)}</div>
        <div class="question-number">${q.number}</div>
        <div class="question">${q.text}</div>
        <div class="options">
          ${q.options.map((opt, i) => {
            const id = `q${index}_${String.fromCharCode(65 + i)}`;
            const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
            return `
              <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
              <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
            `;
          }).join("")}
        </div>
      `;

      seenQuestions.add(index);
      
      document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
      document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
      document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
      
      updateNavPanel();
    }

    function getYearForQuestion(qNum) {
      if (qNum <= 35) return "2025";
      if (qNum <= 55) return "2024";
      if (qNum <= 90) return "2023";
      if (qNum <= 122) return "2022";
      if (qNum <= 134) return "2021-2020";
      if (qNum <= 143) return "2019-2012";
      return "2007-2011";
    }

    function updateNavPanel() {
      const questionList = document.getElementById("questionList");
      questionList.innerHTML = '';
      
      questions.forEach((q, index) => {
        const questionItem = document.createElement("div");
        questionItem.className = "question-item";
        questionItem.textContent = index + 1;
        
        if (userAnswers[index]) {
          questionItem.classList.add("answered");
        } else if (seenQuestions.has(index)) {
          questionItem.classList.add("seen");
        } else {
          questionItem.classList.add("not-seen");
        }
        
        if (index === current) {
          questionItem.classList.add("current");
        }
        
        questionItem.onclick = () => {
          saveAnswer();
          current = index;
          renderQuestion(current);
          toggleNavPanel();
        };
        
        questionList.appendChild(questionItem);
      });
    }

    function toggleNavPanel() {
      const navPanel = document.getElementById("navPanel");
      navPanelVisible = !navPanelVisible;
      navPanel.style.display = navPanelVisible ? "block" : "none";
    }

    function nextQuestion() {
      saveAnswer();
      if (current < questions.length - 1) {
        current++;
        renderQuestion(current);
      }
    }

    function prevQuestion() {
      saveAnswer();
      if (current > 0) {
        current--;
        renderQuestion(current);
      }
    }

    function saveAnswer() {
      const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
      if (selected) {
        userAnswers[current] = selected.value;
      }
    }

    function submitQuiz() {
      saveAnswer();
      const endTime = new Date();
      const timeTakenMs = endTime - startTime;
      const timeTakenMin = Math.floor(timeTakenMs / 60000);
      const timeTakenSec = Math.floor((timeTakenMs % 60000) / 1000);

      let correct = 0;
      const results = [];

      questions.forEach((q, i) => {
        const userAns = userAnswers[i] || "Not Answered";
        const isCorrect = userAns === q.correct;
        if (isCorrect) correct++;
        results.push({
          number: q.number,
          userAns,
          correctAns: q.correct,
          isCorrect
        });
      });

      localStorage.setItem("quizResults", JSON.stringify({
        total: questions.length,
        correct,
        accuracy: (correct / questions.length * 100).toFixed(2),
        time: `${timeTakenMin} min ${timeTakenSec} sec`,
        details: results
      }));

      window.location.href = "MCCW-PRC2.html";
    }

    // Initialize the quiz
    renderQuestion(current);

    // Stopwatch Timer
    let minutes = 0, seconds = 0;
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      seconds++;
      if (seconds === 60) {
        seconds = 0;
        minutes++;
      }
      timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }, 1000);
  </script>
</body>
